{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <p class="eyebrow">ETNERS LIFEFLOW</p>
    <h1>Your Life, connected</h1>
    <p class="intro">사번과 비밀번호로 로그인하면 나에게 필요한 Shared Service를 바로 확인할 수 있습니다.</p>
    {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
    <form method="post" class="auth-form">
      <label class="field">
        <span class="field-label">사번</span>
        <input type="text" name="employee_number" placeholder="예: 100123" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">비밀번호</span>
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="primary">로그인</button>
    </form>
    <p class="auth-hint">데모 계정: 11111 / 0000 (홍길동, 근속 7년+) · 55555 / 0000 (관리자)</p>
  </div>
</div>
{% endblock %}
