{% extends "base.html" %}
{% import "_macros.html" as macros %}
{% block title %}전체 서비스{% endblock %}
{% block content %}
<section class="section-block">
  <div class="section-head">
    <h1>📌 전체 서비스</h1>
  </div>
  <form method="get" class="toolbar">
    <input type="text" name="q" value="{{ keyword }}" placeholder="🔍 어떤 서비스가 필요하세요?">
    <select name="category" onchange="this.form.submit()">
      <option value="">전체 카테고리</option>
      {% for category in categories %}
      <option value="{{ category.id }}" {{ 'selected' if selected_category == category.id }}>{{ category.icon }} {{ category.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">검색</button>
  </form>

  {% if items %}
  <form id="multi-select-form" method="get" action="{{ url_for('services.review_apply') }}">
    <div class="cards">
      {% for item in items %}{{ macros.service_card(item, selectable=True) }}{% endfor %}
    </div>
    <div class="batch-bar" data-batch-bar hidden>
      <span><strong data-batch-count>0</strong>개 서비스 선택됨</span>
      <button type="submit" class="primary">선택 서비스 신청하기</button>
    </div>
  </form>
  {% else %}
  <div class="empty">조건에 맞는 서비스가 없습니다.</div>
  {% endif %}
</section>
{% endblock %}
